[pytest]
qt_api = pyside6
testpaths = tests
addopts = -ra --strict-markers
markers =
    real_confluence: requer credenciais e acesso real explicitamente configurados
    integration: testes opcionais contra APIs reais, sempre desabilitados por padrão
    build: valida scripts e metadados de empacotamento do aplicativo
    slow: teste que pode exceder o tempo normal da suíte sintética
