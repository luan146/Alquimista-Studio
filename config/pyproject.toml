[tool.ruff]
target-version = "py312"
line-length = 120
include = ["alquimista/**/*.py", "tests/**/*.py"]
extend-exclude = ["CODIGOold", "dist", "ALQuimista_Base", "ALQuimista_Auditoria_Temporaria"]

[tool.ruff.lint]
select = ["F", "I", "B"]
ignore = ["B017"]

[tool.mypy]
python_version = "3.12"
files = ["alquimista"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "skip"
