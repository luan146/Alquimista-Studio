name: ALQuimista quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned development dependencies
        shell: pwsh
        run: python -m pip install -c config/constraints.txt -r config/requirements-dev.txt
      - name: Ruff
        shell: pwsh
        run: python -m ruff check --config config/pyproject.toml alquimista tests
      - name: Mypy
        shell: pwsh
        run: python -m mypy --config-file config/pyproject.toml alquimista --follow-imports=skip --ignore-missing-imports
      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q alquimista tools/legacy tests
      - name: Run pytest
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -c config/pytest.ini -q
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build portable and installer distributions
        shell: pwsh
        run: ./tools/build/gerar_distribuicoes.ps1 -Version 0.9.5
      - name: Upload Windows distributions
        uses: actions/upload-artifact@v4
        with:
          name: ALQuimista-Studio-windows-distributions
          path: dist/releases/*
  linux-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -c config/constraints.txt -r config/requirements-dev.txt
      - name: Build Linux portable package
        run: bash tools/build/gerar_portable_linux.sh 0.9.5
      - name: Validate Linux portable package
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/releases/ALQuimista-Studio-linux-portable-0.9.5.tar.gz"
          test -s "$archive"
          tar -tzf "$archive" | grep -Fx 'ALQuimista-Studio-linux-portable/ALQuimista Studio'
          tar -tzf "$archive" | grep -Fx 'ALQuimista-Studio-linux-portable/portable.flag'
      - name: Upload Linux distribution
        uses: actions/upload-artifact@v4
        with:
          name: ALQuimista-Studio-linux-distribution
          path: dist/releases/*.tar.gz
