name: ALQuimista quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned development dependencies
        shell: pwsh
        run: python -m pip install -c config/constraints.txt -r config/requirements-dev.txt
      - name: Ruff
        shell: pwsh
        run: python -m ruff check --config config/pyproject.toml alquimista tests
      - name: Mypy
        shell: pwsh
        run: python -m mypy --config-file config/pyproject.toml alquimista
      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q alquimista tests
      # Before pytest so the real OCR test runs; the build then bundles this installation.
      - name: Install Tesseract with Portuguese and Spanish data
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $tessdata = Join-Path $env:ProgramFiles "Tesseract-OCR\tessdata"
          foreach ($language in "por", "spa") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$language.traineddata" -OutFile (Join-Path $tessdata "$language.traineddata")
          }
      - name: Run pytest
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -c config/pytest.ini -q
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build portable and installer distributions
        shell: pwsh
        run: ./tools/build/gerar_distribuicoes.ps1
      - name: Upload Windows distributions
        uses: actions/upload-artifact@v4
        with:
          name: ALQuimista-Studio-windows-distributions
          path: dist/releases/*
  linux-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -c config/constraints.txt -r config/requirements-dev.txt
      - name: Build Linux portable package
        run: bash tools/build/gerar_portable_linux.sh
      - name: Validate Linux portable package
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls dist/releases/ALQuimista-Studio-linux-portable-*.tar.gz)"
          test -s "$archive"
          tar -tzf "$archive" | grep -Fx 'ALQuimista-Studio-linux-portable/ALQuimista Studio'
          tar -tzf "$archive" | grep -Fx 'ALQuimista-Studio-linux-portable/portable.flag'
      - name: Upload Linux distribution
        uses: actions/upload-artifact@v4
        with:
          name: ALQuimista-Studio-linux-distribution
          path: dist/releases/*.tar.gz
