name: ALQuimista quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned development dependencies
        shell: pwsh
        run: python -m pip install -c config/constraints.txt -r config/requirements-dev.txt
      - name: Ruff
        shell: pwsh
        run: python -m ruff check --config config/pyproject.toml alquimista tests
      - name: Mypy
        shell: pwsh
        run: python -m mypy --config-file config/pyproject.toml alquimista
      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q alquimista tests
      # Before pytest so the real OCR test runs; the build then bundles this installation.
      - name: Install Tesseract with Portuguese and Spanish data
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $tessdata = Join-Path $env:ProgramFiles "Tesseract-OCR\tessdata"
          foreach ($language in "por", "spa") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$language.traineddata" -OutFile (Join-Path $tessdata "$language.traineddata")
          }
      - name: Run pytest
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -c config/pytest.ini -q
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build portable and installer distributions
        shell: pwsh
        run: ./tools/build/gerar_distribuicoes.ps1
      - name: Check the Windows packages
        shell: pwsh
        run: ./tools/build/testar_pacotes_windows.ps1
      - name: Upload Windows distributions
        uses: actions/upload-artifact@v4
        with:
          name: ALQuimista-Studio-windows-distributions
          path: dist/releases/*
  linux-distribution:
    # Oldest supported Ubuntu: the executable also runs on newer distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tesseract goes inside the portable package; PyInstaller bundles the xcb libraries Qt needs.
      - name: Install Tesseract and the Qt window libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-spa libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0
      - name: Install pinned dependencies
        run: python -m pip install -c config/constraints.txt -r config/requirements-dev.txt
      - name: Build Linux portable package and installer
        run: bash tools/build/gerar_portable_linux.sh
      - name: Check the Linux packages on clean Ubuntu 22.04 and 24.04
        run: bash tools/build/testar_pacotes_linux.sh
      - name: Upload Linux distributions
        uses: actions/upload-artifact@v4
        with:
          name: ALQuimista-Studio-linux-distributions
          path: dist/releases/*
  # Pushing a tag such as v1.0.0 publishes the five files on the GitHub releases page.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux-distribution]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' alquimista/__init__.py)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::A marca $GITHUB_REF_NAME não bate com a versão $version de alquimista/__init__.py."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" releases/* --title "ALQuimista Studio $version" --generate-notes
