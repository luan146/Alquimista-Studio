name: ALQuimista quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned development dependencies
        shell: pwsh
        run: python -m pip install -c config/constraints.txt -r config/requirements-dev.txt
      - name: Static checks
        shell: pwsh
        run: |
          python -m ruff check --config config/pyproject.toml alquimista tests
          python -m mypy --config-file config/pyproject.toml alquimista --follow-imports=skip --ignore-missing-imports
      - name: Compile and test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q alquimista tools/legacy tests
          python -m pytest -c config/pytest.ini -q
      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean "packaging/ALQuimista Studio.spec"
